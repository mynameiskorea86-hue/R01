<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 메뉴 화면</title>
    <!-- 깔끔한 모던 폰트 적용 (Pretendard / Sans-serif) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* 섹션 타이틀 스타일 */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #191f28;
            margin-bottom: 16px;
        }

        /* 2x2 그리드 메뉴 레이아웃 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        /* 카드 기본 스타일 */
        .card {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 24px 20px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        }

        /* 카드 내부 텍스트 */
        .card-sub {
            font-size: 13px;
            color: #8b95a1;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #333d4b;
            line-height: 1.4;
        }

        /* 카드 내부 아이콘 이미지/이모지 영역 */
        .card-icon {
            align-self: flex-end;
            font-size: 28px;
            margin-top: 10px;
        }

        /* 마이데이터 전체 너비 카드 스타일 */
        .mydata-card {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .mydata-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        }

        .mydata-content .card-sub {
            margin-bottom: 6px;
        }

        .mydata-link {
            font-size: 13px;
            color: #8b95a1;
            margin-top: 8px;
            display: inline-block;
            font-weight: 600;
        }

        .mydata-icon {
            font-size: 40px;
            margin-left: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 2x2 메뉴 그리드 -->
        <div class="menu-grid">
            <!-- 카드 1 -->
            <div class="card">
                <div>
                    <div class="card-sub">방방곡곡</div>
                    <div class="card-title">황금쌀 찾기</div>
                </div>
                <div class="card-icon">🌾</div>
            </div>

            <!-- 카드 2 -->
            <div class="card">
                <div>
                    <div class="card-sub">한정수량!</div>
                    <div class="card-title">특판상품</div>
                </div>
                <div class="card-icon">📢</div>
            </div>

            <!-- 카드 3 -->
            <div class="card">
                <div>
                    <div class="card-sub">내게 딱맞는!</div>
                    <div class="card-title">예·적금 찾기</div>
                </div>
                <div class="card-icon">🎯</div>
            </div>

            <!-- 카드 4 -->
            <div class="card">
                <div>
                    <div class="card-sub">안전한 재테크</div>
                    <div class="card-title">금융상품몰</div>
                </div>
                <div class="card-icon">🛍️</div>
            </div>
        </div>

        <!-- 마이데이터 섹션 -->
        <div class="section-title">마이데이터</div>
        <div class="mydata-card">
            <div class="mydata-content">
                <div class="card-sub">데이터 분석 기반</div>
                <div class="card-title">나만을 위한 자산관리 서비스</div>
                <div class="mydata-link">진단 받고 자산관리 시작 &gt;</div>
            </div>
            <div class="mydata-icon">📊</div>
        </div>
    </div>

</body>
</html>
