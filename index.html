<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5기갑 방공대 커뮤니티</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h2 {
      font-size: 14px;
      color: #0056b3;
      font-weight: 700;
      letter-spacing: 1px;
    }

    header h1 {
      font-size: 22px;
      color: #111;
      margin-top: 4px;
    }

    main {
      display: none;
    }

    main.active {
      display: block !important;
    }

    .hidden {
      display: none !important;
    }

    .card {
      background-color: #f8f9fa;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #e9ecef;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 14px;
      color: #222;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #495057;
      margin-top: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #0056b3;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .primary-btn {
      background-color: #0056b3;
      color: white;
      padding: 12px;
      width: 100%;
    }

    .primary-btn:hover {
      background-color: #004085;
    }

    .ghost-btn {
      background-color: transparent;
      color: #495057;
      border: 1px solid #ced4da;
      padding: 10px;
      width: 100%;
    }

    .ghost-btn:hover {
      background-color: #e9ecef;
    }

    .user-profile-card {
      background-color: #eef5ff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }

    .user-profile-card h3 {
      font-size: 16px;
      color: #004085;
      margin-bottom: 4px;
    }

    .user-profile-card p {
      font-size: 13px;
      color: #6c757d;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .menu-card {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 18px 10px;
      font-size: 14px;
      color: #333;
      text-align: center;
      border-radius: 10px;
    }

    .menu-card:hover {
      background-color: #e2e6ea;
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .detail-header button {
      width: auto;
      padding: 6px 12px;
      font-size: 12px;
    }

    .detail-header h2 {
      font-size: 18px;
    }

    /* 상태 표시 스타일 */
    .status-badge {
      font-weight: bold;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .status-reviewing {
      color: #111111;
      background-color: #e2e3e5;
    }

    .status-completed {
      color: #28a745;
      background-color: #d4edda;
    }

    .status-reexamine {
      color: #dc3545;
      background-color: #f8d7da;
    }

    footer {
      margin-top: auto;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2>5기갑</h2>
      <h1>방공대 커뮤니티</h1>
    </header>

    <!-- 로그인 및 회원가입 화면 -->
    <main id="authScreen" class="active">
      <div class="card">
        <h3>로그인</h3>
        <form id="loginForm">
          <label>군번(아이디)</label>
          <input type="text" id="loginMilNumber" placeholder="예: 21-123456" required>
          
          <label>비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력" required>
          
          <button type="submit" class="primary-btn">로그인</button>
        </form>
        <button id="showRegisterBtn" class="ghost-btn" style="margin-top: 10px;">회원가입</button>
      </div>

      <div id="registerCard" class="card hidden" style="margin-top: 15px;">
        <h3>회원가입</h3>
        <form id="registerForm">
          <label>군번</label>
          <input type="text" id="milNumber" placeholder="예: 21-123456" required>

          <label>이름</label>
          <input type="text" id="registerName" placeholder="예: 홍길동" required>

          <label>부대 코드</label>
          <input type="text" id="unitCode" placeholder="예: 1-1대대" required>

          <label>직책</label>
          <select id="roleSelect" required>
            <option value="user" selected>용사</option>
            <option value="officer">간부</option>
            <option value="commander">지휘자</option>
            <option value="admin">관리자</option>
          </select>

          <div id="registerSoldierDatesGroup" style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
            <label>입대일</label>
            <input type="date" id="registerEnlistDate">

            <label>전역예정일</label>
            <input type="date" id="registerDischargeDate">
          </div>

          <label style="margin-top: 8px;">비밀번호 설정</label>
          <input type="password" id="registerPassword" placeholder="비밀번호 입력" required>

          <label>비밀번호 확인</label>
          <input type="password" id="registerPasswordConfirm" placeholder="비밀번호 다시 입력" required>

          <button type="submit" class="primary-btn" style="margin-top: 15px;">가입하기</button>
        </form>
      </div>
    </main>

    <!-- 메인 홈 화면 -->
    <main id="homeScreen" class="hidden">
      <div class="user-profile-card">
        <h3 id="userGreeting">사용자님 환영합니다</h3>
        <p id="userInfoText">정보 로딩 중...</p>
      </div>

      <div class="menu-grid">
        <button class="menu-card" data-menu="leave">📅 출타신청</button>
        <button class="menu-card" data-menu="letter">💬 대장과의 대화</button>
        <button class="menu-card" data-menu="barber">✂️ 이발소 신청</button>
        <button class="menu-card" data-menu="suggestion">📝 건의사항</button>
        <button class="menu-card" data-menu="notice">📢 공지사항</button>
        <button id="adminCard" class="menu-card hidden" data-menu="admin" style="background-color: #e2e3e5;">🗂️ 관리자 DB</button>
      </div>
    </main>

    <!-- 상세 화면 -->
    <main id="detailScreen" class="hidden">
      <div class="detail-header">
        <button id="backToHomeBtn" class="ghost-btn">← 뒤로가기</button>
        <h2 id="detailTitle">상세 페이지</h2>
      </div>
      <div id="detailContent" class="card"></div>
    </main>

    <footer>
      <button id="logoutBtn" class="ghost-btn hidden" style="color: #dc3545; border-color: #dc3545;">로그아웃</button>
    </footer>
  </div>

  <script>
    const STORAGE_KEYS = {
      USERS: 'app_users',
      SESSION: 'app_session',
      LETTERS: 'app_letters',
      LEAVES: 'app_leaves',
      BARBER: 'app_barber',
      SUGGESTIONS: 'app_suggestions',
      NOTICES: 'app_notices'
    };

    function getTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function initDefaultData() {
      let savedUsers = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
      
      const hasAdmin = savedUsers.some(u => u.milNumber === 'admin');
      if (!hasAdmin) {
        savedUsers.push({
          milNumber: 'admin',
          password: 'admin1234',
          name: '최고관리자',
          role: 'admin',
          unitCode: '본부'
        });
      }

      localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(savedUsers));
      return savedUsers;
    }

    let users = initDefaultData();
    let currentUser = JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSION)) || null;

    let letters = JSON.parse(localStorage.getItem(STORAGE_KEYS.LETTERS)) || [];
    let leaves = JSON.parse(localStorage.getItem(STORAGE_KEYS.LEAVES)) || [];
    let barberBookings = JSON.parse(localStorage.getItem(STORAGE_KEYS.BARBER)) || [];
    let suggestions = JSON.parse(localStorage.getItem(STORAGE_KEYS.SUGGESTIONS)) || [];
    let notices = JSON.parse(localStorage.getItem(STORAGE_KEYS.NOTICES)) || [
      { id: 1, title: '5기갑 방공대 커뮤니티 앱 정식 오픈 안내', content: '부대 소통 활성화를 위한 앱이 오픈되었습니다.', date: '2026-08-01' }
    ];

    function initApp() {
      const authScreen = document.getElementById('authScreen');
      const homeScreen = document.getElementById('homeScreen');
      const detailScreen = document.getElementById('detailScreen');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const registerCard = document.getElementById('registerCard');
      const showRegisterBtn = document.getElementById('showRegisterBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const backToHomeBtn = document.getElementById('backToHomeBtn');
      const adminCard = document.getElementById('adminCard');

      const roleSelect = document.getElementById('roleSelect');
      const registerSoldierDatesGroup = document.getElementById('registerSoldierDatesGroup');

      if (roleSelect && registerSoldierDatesGroup) {
        roleSelect.addEventListener('change', () => {
          if (roleSelect.value === 'user') {
            registerSoldierDatesGroup.style.display = 'flex';
          } else {
            registerSoldierDatesGroup.style.display = 'none';
          }
        });
      }

      function showScreen(targetScreen) {
        [authScreen, homeScreen, detailScreen].forEach(s => {
          if (s) {
            s.style.display = 'none';
            s.classList.remove('active');
            s.classList.add('hidden');
          }
        });

        if (targetScreen) {
          targetScreen.style.display = 'block';
          targetScreen.classList.remove('hidden');
          targetScreen.classList.add('active');
        }
      }

      function updateUI() {
        if (currentUser) {
          let roleName = '용사';
          if (currentUser.role === 'officer') roleName = '간부';
          if (currentUser.role === 'commander') roleName = '지휘자';
          if (currentUser.role === 'admin') roleName = '관리자';

          document.getElementById('userGreeting').textContent = `${currentUser.name} (${roleName})님 환영합니다`;
          document.getElementById('userInfoText').textContent = `${currentUser.milNumber} · ${currentUser.unitCode}`;
          
          if (logoutBtn) logoutBtn.classList.remove('hidden');

          if (adminCard) {
            if (currentUser.role === 'admin') {
              adminCard.classList.remove('hidden');
            } else {
              adminCard.classList.add('hidden');
            }
          }

          showScreen(homeScreen);
        } else {
          if (logoutBtn) logoutBtn.classList.add('hidden');
          showScreen(authScreen);
        }
      }

      showRegisterBtn?.addEventListener('click', () => {
        registerCard.classList.toggle('hidden');
      });

      registerForm?.addEventListener('submit', (e) => {
        e.preventDefault();
        const milNumber = document.getElementById('milNumber').value.trim();
        const name = document.getElementById('registerName').value.trim();
        const unitCode = document.getElementById('unitCode').value.trim();
        const role = document.getElementById('roleSelect').value;
        const password = document.getElementById('registerPassword').value;
        const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

        if (password !== passwordConfirm) {
          alert('비밀번호가 일치하지 않습니다. 다시 확인해 주세요.');
          document.getElementById('registerPasswordConfirm').focus();
          return;
        }

        users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
        const existingUserIndex = users.findIndex(u => u.milNumber === milNumber);

        if (existingUserIndex !== -1) {
          if (users[existingUserIndex].password) {
            alert('이미 회원가입이 완료된 계정입니다.');
            return;
          } else {
            users[existingUserIndex].name = name;
            users[existingUserIndex].unitCode = unitCode;
            users[existingUserIndex].role = role;
            users[existingUserIndex].password = password;

            if (role === 'user') {
              users[existingUserIndex].enlistDate = document.getElementById('registerEnlistDate').value;
              users[existingUserIndex].dischargeDate = document.getElementById('registerDischargeDate').value;
            }
          }
        } else {
          const newUser = { milNumber, name, unitCode, role, password };
          if (role === 'user') {
            newUser.enlistDate = document.getElementById('registerEnlistDate').value;
            newUser.dischargeDate = document.getElementById('registerDischargeDate').value;
          }
          users.push(newUser);
        }

        localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
        alert('회원가입이 완료되었습니다! 설정하신 비밀번호로 로그인해 주세요.');
        registerCard.classList.add('hidden');
        registerForm.reset();

        if (registerSoldierDatesGroup) registerSoldierDatesGroup.style.display = 'flex';
      });

      loginForm?.addEventListener('submit', (e) => {
        e.preventDefault();
        const milNumber = document.getElementById('loginMilNumber').value.trim();
        const password = document.getElementById('loginPassword').value;

        users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
        const user = users.find(u => u.milNumber === milNumber && u.password === password && u.password !== '');
        
        if (user) {
          currentUser = user;
          localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(currentUser));
          updateUI();
        } else {
          alert('군번(아이디) 또는 비밀번호가 올바르지 않거나, 회원가입이 완료되지 않은 계정입니다.');
        }
      });

      logoutBtn?.addEventListener('click', () => {
        currentUser = null;
        localStorage.removeItem(STORAGE_KEYS.SESSION);
        updateUI();
      });

      backToHomeBtn?.addEventListener('click', () => {
        showScreen(homeScreen);
      });

      document.querySelectorAll('.menu-card').forEach(btn => {
        btn.addEventListener('click', () => {
          const menu = btn.dataset.menu;
          if (menu === 'leave') openLeavePage();
          else if (menu === 'letter') openLetterBoard();
          else if (menu === 'barber') openBarberPage();
          else if (menu === 'suggestion') openSuggestionPage();
          else if (menu === 'notice') openNoticePage();
          else if (menu === 'admin') openAdminPage();
        });
      });

      function openLeavePage() {
        document.getElementById('detailTitle').textContent = '방공대 출타신청';
        const detailContent = document.getElementById('detailContent');
        const today = getTodayString();

        detailContent.innerHTML = `
          <form id="leaveForm" style="display:flex; flex-direction:column; gap:10px;">
            <label>출타 유형
              <select id="leaveType" style="width:100%; padding:8px;" required>
                <option value="휴가">휴가</option>
                <option value="외박">외박</option>
                <option value="외출">외출</option>
              </select>
            </label>
            <label>시작일 <input type="date" id="leaveStart" min="${today}" style="width:100%; padding:8px;" required /></label>
            <label>종료일 <input type="date" id="leaveEnd" min="${today}" style="width:100%; padding:8px;" required /></label>
            <label>사유 <input type="text" id="leaveReason" placeholder="출타 사유 입력" style="width:100%; padding:8px;" required /></label>
            <button type="submit" class="primary-btn">신청하기</button>
          </form>
          <hr style="margin:20px 0; border:none; border-top:1px solid #eee;" />
          <h3>내 신청 현황</h3>
          <div id="leaveList"></div>
        `;

        renderLeaveList();

        const startInput = document.getElementById('leaveStart');
        const endInput = document.getElementById('leaveEnd');

        startInput.addEventListener('change', () => {
          endInput.min = startInput.value;
          if (endInput.value && endInput.value < startInput.value) {
            endInput.value = startInput.value;
          }
        });

        document.getElementById('leaveForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const newLeave = {
            id: Date.now(),
            milNumber: currentUser.milNumber,
            name: currentUser.name,
            type: document.getElementById('leaveType').value,
            start: startInput.value,
            end: endInput.value,
            reason: document.getElementById('leaveReason').value,
            status: '대기중'
          };
          leaves.unshift(newLeave);
          localStorage.setItem(STORAGE_KEYS.LEAVES, JSON.stringify(leaves));
          alert('출타 신청이 완료되었습니다.');
          renderLeaveList();
        });

        showScreen(detailScreen);
      }

      function renderLeaveList() {
        const leaveList = document.getElementById('leaveList');
        const myLeaves = leaves.filter(l => l.milNumber === currentUser.milNumber);

        if (myLeaves.length === 0) {
          leaveList.innerHTML = `<p style="font-size:12px; color:#888;">신청 내역이 없습니다.</p>`;
          return;
        }

        leaveList.innerHTML = myLeaves.map(l => `
          <div style="border:1px solid #ddd; padding:10px; border-radius:6px; margin-bottom:8px; background:#fff;">
            <strong>[${l.type}]</strong> ${l.start} ~ ${l.end}<br/>
            <span style="font-size:12px; color:#555;">사유: ${l.reason}</span><br/>
            <span style="font-size:12px; color:#007bff;">상태: ${l.status}</span>
          </div>
        `).join('');
      }

      function openLetterBoard() {
        document.getElementById('detailTitle').textContent = '대장과의 대화 (마음의 편지)';
        renderLetterList();
        showScreen(detailScreen);
      }

      function getStatusBadgeHTML(status) {
        if (status === '조치완료') {
          return `<span class="status-badge status-completed">조치완료</span>`;
        } else if (status === '재검토') {
          return `<span class="status-badge status-reexamine">재검토</span>`;
        } else {
          return `<span class="status-badge status-reviewing">검토중</span>`;
        }
      }

      function renderLetterList() {
        const detailContent = document.getElementById('detailContent');

        let html = `
          <div style="margin-bottom: 20px;">
            <button id="writeLetterBtn" class="primary-btn" style="width:100%; margin-bottom:15px;">✍️ 마음의 편지 작성하기</button>
            <div id="letterWriteForm" class="hidden" style="background:#f5f5f5; padding:15px; border-radius:8px; margin-bottom:15px;">
              <input type="text" id="letterTitle" placeholder="제목을 입력하세요" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;" required />
              <textarea id="letterText" placeholder="내용을 입력하세요..." style="width:100%; height:100px; padding:8px; margin-bottom:10px; box-sizing:border-box;" required></textarea>
              <button id="submitLetterBtn" class="primary-btn" style="width:100%;">등록</button>
            </div>
          </div>
          <div class="letter-list">
        `;

        if (letters.length === 0) {
          html += `<p style="text-align:center; color:#888;">등록된 편지가 없습니다.</p>`;
        } else {
          letters.forEach((post) => {
            const canAccess = currentUser.milNumber === post.authorMilNumber || currentUser.role === 'commander';
            const isMyPost = currentUser.milNumber === post.authorMilNumber;
            const authorDisplay = isMyPost ? '본인' : '익명 (***)';
            const status = post.status || '검토중';

            html += `
              <div class="letter-card" style="border:1px solid #eee; padding:12px; border-radius:8px; margin-bottom:12px; background:#fff;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <h4 style="margin:0; font-size:16px;">${canAccess ? '🔓 ' : '🔒 '}${post.title}</h4>
                  <div>${getStatusBadgeHTML(status)}</div>
                </div>
                <p style="font-size:12px; color:#666; margin:6px 0;">작성자: ${authorDisplay} | 작성일: ${post.createdAt}</p>
                
                ${canAccess ? `
                  <div style="margin-top:10px; padding:10px; background:#f9f9f9; border-radius:6px; font-size:14px;">
                    ${post.content.replace(/\n/g, '<br>')}
                  </div>
                  
                  ${currentUser.role === 'commander' ? `
                    <div style="margin-top:8px; display:flex; gap:6px; align-items:center;">
                      <span style="font-size:12px; font-weight:bold; color:#555;">상태 변경:</span>
                      <button class="change-status-btn" data-post-id="${post.id}" data-status="조치완료" style="padding:4px 8px; font-size:11px; background-color:#28a745; color:white;">조치완료</button>
                      <button class="change-status-btn" data-post-id="${post.id}" data-status="재검토" style="padding:4px 8px; font-size:11px; background-color:#dc3545; color:white;">재검토</button>
                    </div>
                  ` : ''}

                  <div style="margin-top:12px; border-top:1px dashed #ddd; padding-top:10px;">
                    <h5 style="margin:0 0 6px 0;">지휘관 답변 및 대화</h5>
                    ${renderComments(post.id, post.comments)}
                    
                    ${(currentUser.role === 'commander' || isMyPost) ? `
                      <div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">
                        <textarea id="commentInput-${post.id}" placeholder="댓글 또는 답변을 작성하세요..." style="width:100%; height:60px; padding:8px; font-size:13px; resize:vertical;"></textarea>
                        <button class="add-comment-btn primary-btn" data-post-id="${post.id}" style="padding:8px; font-size:13px; width:100%;">답변 등록 / 수정</button>
                      </div>
                    ` : ''}
                  </div>
                ` : `
                  <p style="font-size:12px; color:#d9534f; margin-top:8px;">🔒 비밀글입니다. 작성자와 지휘관만 열람할 수 있습니다.</p>
                `}
              </div>
            `;
          });
        }

        html += `</div>`;
        detailContent.innerHTML = html;

        document.getElementById('writeLetterBtn')?.addEventListener('click', () => {
          document.getElementById('letterWriteForm').classList.toggle('hidden');
        });

        document.getElementById('submitLetterBtn')?.addEventListener('click', createLetter);

        document.querySelectorAll('.add-comment-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const postId = parseInt(e.target.dataset.postId);
            addOrUpdateComment(postId);
          });
        });

        document.querySelectorAll('.edit-comment-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const postId = parseInt(e.target.dataset.postId);
            const commentId = parseInt(e.target.dataset.commentId);
            prepareCommentEdit(postId, commentId);
          });
        });

        document.querySelectorAll('.change-status-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const postId = parseInt(e.target.dataset.postId);
            const status = e.target.dataset.status;
            updateLetterStatus(postId, status);
          });
        });
      }

      function renderComments(postId, comments = []) {
        if (comments.length === 0) {
          return `<p style="font-size:11px; color:#999; margin:4px 0;">등록된 답변이 없습니다.</p>`;
        }
        return comments.map(c => {
          const isMyComment = (currentUser.role === 'commander' && c.role === 'commander') || (c.author === currentUser.name);

          return `
            <div style="font-size:12px; background:#fff; padding:8px; border-radius:6px; margin-bottom:6px; border:1px solid #e9ecef;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <strong>[${c.role === 'commander' ? '지휘관' : '작성자'}]</strong>
                <div>
                  <span style="font-size:10px; color:#aaa; margin-right:6px;">${c.createdAt}</span>
                  ${isMyComment ? `<button class="edit-comment-btn ghost-btn" data-post-id="${postId}" data-comment-id="${c.id}" style="padding:2px 6px; font-size:10px; display:inline;">수정</button>` : ''}
                </div>
              </div>
              <div style="font-size:13px; color:#333; white-space:pre-wrap;">${c.content}</div>
            </div>
          `;
        }).join('');
      }

      function createLetter() {
        const title = document.getElementById('letterTitle').value.trim();
        const content = document.getElementById('letterText').value.trim();

        if (!title || !content) {
          alert('제목과 내용을 모두 입력해 주세요.');
          return;
        }

        const today = getTodayString();
        const newLetter = {
          id: Date.now(),
          title,
          content,
          authorMilNumber: currentUser.milNumber,
          authorName: currentUser.name,
          createdAt: today,
          status: '검토중',
          comments: []
        };

        letters.unshift(newLetter);
        localStorage.setItem(STORAGE_KEYS.LETTERS, JSON.stringify(letters));
        renderLetterList();
      }

      function prepareCommentEdit(postId, commentId) {
        const post = letters.find(l => l.id === postId);
        if (!post) return;

        const comment = post.comments.find(c => c.id === commentId);
        if (!comment) return;

        const textarea = document.getElementById(`commentInput-${postId}`);
        const button = document.querySelector(`.add-comment-btn[data-post-id="${postId}"]`);

        if (textarea && button) {
          textarea.value = comment.content;
          textarea.dataset.editingCommentId = commentId;
          button.textContent = '답변 수정 완료';
          textarea.focus();
        }
      }

      function addOrUpdateComment(postId) {
        const textarea = document.getElementById(`commentInput-${postId}`);
        const content = textarea.value.trim();

        if (!content) {
          alert('내용을 입력해 주세요.');
          return;
        }

        const post = letters.find(l => l.id === postId);
        if (post) {
          const today = getTodayString();
          const editingId = textarea.dataset.editingCommentId;

          if (editingId) {
            const comment = post.comments.find(c => c.id === parseInt(editingId));
            if (comment) {
              comment.content = content;
              comment.createdAt = today + ' (수정됨)';
            }
          } else {
            post.comments.push({
              id: Date.now(),
              author: currentUser.name,
              role: currentUser.role,
              content,
              createdAt: today
            });
          }

          localStorage.setItem(STORAGE_KEYS.LETTERS, JSON.stringify(letters));
          renderLetterList();
        }
      }

      function updateLetterStatus(postId, newStatus) {
        const post = letters.find(l => l.id === postId);
        if (post) {
          post.status = newStatus;
          localStorage.setItem(STORAGE_KEYS.LETTERS, JSON.stringify(letters));
          renderLetterList();
        }
      }

      function openBarberPage() {
        document.getElementById('detailTitle').textContent = '이발소 예약 신청';
        const detailContent = document.getElementById('detailContent');
        const today = getTodayString();

        detailContent.innerHTML = `
          <form id="barberForm" style="display:flex; flex-direction:column; gap:10px;">
            <label>예약 희망일 <input type="date" id="barberDate" min="${today}" style="width:100%; padding:8px;" required /></label>
            <button type="submit" class="primary-btn">예약하기</button>
          </form>
          <hr style="margin:20px 0; border:none; border-top:1px solid #eee;" />
          <h3>내 예약 내역</h3>
          <div id="barberList"></div>
        `;

        renderBarberList();

        document.getElementById('barberForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const newBooking = {
            id: Date.now(),
            milNumber: currentUser.milNumber,
            name: currentUser.name,
            date: document.getElementById('barberDate').value
          };

          barberBookings.unshift(newBooking);
          localStorage.setItem(STORAGE_KEYS.BARBER, JSON.stringify(barberBookings));
          alert('이발소 예약이 완료되었습니다.');
          renderBarberList();
        });

        showScreen(detailScreen);
      }

      function renderBarberList() {
        const list = document.getElementById('barberList');
        const myBookings = barberBookings.filter(b => b.milNumber === currentUser.milNumber);

        if (myBookings.length === 0) {
          list.innerHTML = `<p style="font-size:12px; color:#888;">예약 내역이 없습니다.</p>`;
          return;
        }

        list.innerHTML = myBookings.map(b => `
          <div style="border:1px solid #ddd; padding:10px; border-radius:6px; margin-bottom:8px; background:#fff;">
            📅 <strong>${b.date}</strong> - 예약완료
          </div>
        `).join('');
      }

      function openSuggestionPage() {
        document.getElementById('detailTitle').textContent = '건의사항';
        const detailContent = document.getElementById('detailContent');

        detailContent.innerHTML = `
          <form id="suggestionForm" style="display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="suggestionTitle" placeholder="제목" style="padding:8px;" required />
            <textarea id="suggestionContent" placeholder="건의할 내용을 입력해 주세요" style="height:80px; padding:8px;" required></textarea>
            <button type="submit" class="primary-btn">건의하기</button>
          </form>
          <hr style="margin:20px 0; border:none; border-top:1px solid #eee;" />
          <h3>등록된 건의사항 목록</h3>
          <div id="suggestionList"></div>
        `;

        renderSuggestionList();

        document.getElementById('suggestionForm').addEventListener('submit', (e) => {
          e.preventDefault();
          const newSugg = {
            id: Date.now(),
            title: document.getElementById('suggestionTitle').value.trim(),
            content: document.getElementById('suggestionContent').value.trim(),
            authorName: currentUser.name,
            date: getTodayString()
          };

          suggestions.unshift(newSugg);
          localStorage.setItem(STORAGE_KEYS.SUGGESTIONS, JSON.stringify(suggestions));
          alert('건의사항이 등록되었습니다.');
          renderSuggestionList();
        });

        showScreen(detailScreen);
      }

      function renderSuggestionList() {
        const list = document.getElementById('suggestionList');
        if (suggestions.length === 0) {
          list.innerHTML = `<p style="font-size:12px; color:#888;">등록된 건의사항이 없습니다.</p>`;
          return;
        }

        list.innerHTML = suggestions.map(s => `
          <div style="border:1px solid #ddd; padding:10px; border-radius:6px; margin-bottom:8px; background:#fff;">
            <h4 style="margin:0 0 4px 0;">${s.title}</h4>
            <p style="font-size:12px; color:#666; margin:0 0 6px 0;">작성자: ${s.authorName} | ${s.date}</p>
            <p style="font-size:13px; margin:0;">${s.content}</p>
          </div>
        `).join('');
      }

      function openNoticePage() {
        document.getElementById('detailTitle').textContent = '공지사항';
        const detailContent = document.getElementById('detailContent');

        if (notices.length === 0) {
          detailContent.innerHTML = `<p style="text-align:center; color:#888;">등록된 공지사항이 없습니다.</p>`;
        } else {
          detailContent.innerHTML = notices.map(n => `
            <div style="border:1px solid #ddd; padding:12px; border-radius:6px; margin-bottom:10px; background:#fff;">
              <h4 style="margin:0 0 6px 0; font-size:15px; color:#0056b3;">📢 ${n.title}</h4>
              <p style="font-size:11px; color:#888; margin:0 0 8px 0;">등록일: ${n.date}</p>
              <div style="font-size:13px; color:#333;">${n.content}</div>
            </div>
          `).join('');
        }

        showScreen(detailScreen);
      }

      function openAdminPage() {
        if (!currentUser || currentUser.role !== 'admin') {
          alert('관리자만 접근 가능한 페이지입니다.');
          showScreen(homeScreen);
          return;
        }

        document.getElementById('detailTitle').textContent = '관리자 DB 제어';
        const detailContent = document.getElementById('detailContent');

        detailContent.innerHTML = `
          <div style="background:#f9f9f9; padding:12px; border-radius:8px; margin-bottom:15px; border:1px solid #e0e0e0;">
            <h3 style="margin-top:0;">➕ 신규 인원 DB 입력</h3>
            <form id="adminAddUserForm" style="display:flex; flex-direction:column; gap:8px;">
              <label style="font-size:12px;">직책 선택
                <select id="dbRole" style="width:100%; padding:6px;" required>
                  <option value="user">용사</option>
                  <option value="officer">간부</option>
                  <option value="commander">지휘자</option>
                  <option value="admin">관리자</option>
                </select>
              </label>
              <label style="font-size:12px;">군번(아이디)
                <input type="text" id="dbMilNumber" placeholder="예: 21-123456" style="width:100%; padding:6px; box-sizing:border-box;" required />
              </label>
              <label style="font-size:12px;">이름
                <input type="text" id="dbName" placeholder="예: 홍길동" style="width:100%; padding:6px; box-sizing:border-box;" required />
              </label>
              <label style="font-size:12px;">부대 코드
                <input type="text" id="dbUnitCode" placeholder="예: 5기갑 방공대" style="width:100%; padding:6px; box-sizing:border-box;" required />
              </label>
              
              <div id="soldierDatesGroup" style="display:flex; flex-direction:column; gap:8px;">
                <label style="font-size:12px;">입대일
                  <input type="date" id="dbEnlistDate" style="width:100%; padding:6px; box-sizing:border-box;" />
                </label>
                <label style="font-size:12px;">전역예정일
                  <input type="date" id="dbDischargeDate" style="width:100%; padding:6px; box-sizing:border-box;" />
                </label>
              </div>

              <button type="submit" class="primary-btn" style="margin-top:5px;">DB 등록하기</button>
            </form>
          </div>

          <hr style="margin:20px 0; border:none; border-top:1px solid #eee;" />
          <h3>전체 등록 인원 목록 (<span id="userCount">${users.length}</span>명)</h3>
          <div id="adminUserList" style="max-height:300px; overflow-y:auto;"></div>
        `;

        const dbRoleSelect = document.getElementById('dbRole');
        const soldierDatesGroup = document.getElementById('soldierDatesGroup');

        dbRoleSelect.addEventListener('change', () => {
          if (dbRoleSelect.value === 'user') {
            soldierDatesGroup.style.display = 'flex';
          } else {
            soldierDatesGroup.style.display = 'none';
          }
        });

        document.getElementById('adminAddUserForm').addEventListener('submit', (e) => {
          e.preventDefault();

          const role = dbRoleSelect.value;
          const milNumber = document.getElementById('dbMilNumber').value.trim();
          const name = document.getElementById('dbName').value.trim();
          const unitCode = document.getElementById('dbUnitCode').value.trim();

          if (users.find(u => u.milNumber === milNumber)) {
            alert('이미 등록된 군번입니다.');
            return;
          }

          const newUser = { milNumber, name, unitCode, role, password: '' };

          if (role === 'user') {
            newUser.enlistDate = document.getElementById('dbEnlistDate').value;
            newUser.dischargeDate = document.getElementById('dbDischargeDate').value;
          }

          users.push(newUser);
          localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
          alert(`${name} (${milNumber}) 님이 DB에 등록되었습니다.\n(해당 사용자가 직접 회원가입을 거쳐 비밀번호를 설정할 수 있습니다.)`);

          document.getElementById('adminAddUserForm').reset();
          soldierDatesGroup.style.display = 'flex';
          renderAdminUserList();
        });

        renderAdminUserList();
        showScreen(detailScreen);
      }

      function renderAdminUserList() {
        const listContainer = document.getElementById('adminUserList');
        document.getElementById('userCount').textContent = users.length;

        listContainer.innerHTML = users.map(u => {
          let roleLabel = '용사';
          if (u.role === 'officer') roleLabel = '간부';
          if (u.role === 'commander') roleLabel = '지휘자';
          if (u.role === 'admin') roleLabel = '관리자';

          const statusBadge = u.password ? '<span style="color:green; font-weight:bold;">[가입완료]</span>' : '<span style="color:orange; font-weight:bold;">[미가입/DB만등록]</span>';

          return `
            <div style="border-bottom:1px solid #eee; padding:10px 0; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <strong>${u.name}</strong> (${u.milNumber}) - <span style="color:#007bff; font-weight:bold;">${roleLabel}</span> ${statusBadge}<br/>
                <span style="color:#666;">부대코드: ${u.unitCode}</span>
                ${u.role === 'user' && u.enlistDate ? `<br/><span style="color:#888;">입대: ${u.enlistDate} / 전역: ${u.dischargeDate || '-'}</span>` : ''}
              </div>
              <div style="display:flex; gap:4px;">
                <button class="edit-user-btn ghost-btn" data-mil="${u.milNumber}" style="padding:4px 8px; font-size:11px;">수정</button>
                <button class="delete-user-btn primary-btn" data-mil="${u.milNumber}" style="padding:4px 8px; font-size:11px; background-color:#dc3545;">삭제</button>
              </div>
            </div>
          `;
        }).join('');

        document.querySelectorAll('.edit-user-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const milNumber = e.target.dataset.mil;
            editUserDB(milNumber);
          });
        });

        document.querySelectorAll('.delete-user-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const milNumber = e.target.dataset.mil;
            deleteUserDB(milNumber);
          });
        });
      }

      function editUserDB(milNumber) {
        const targetUser = users.find(u => u.milNumber === milNumber);
        if (!targetUser) return;

        const newName = prompt('수정할 이름을 입력하세요:', targetUser.name);
        if (newName === null) return;

        const newUnitCode = prompt('수정할 부대 코드를 입력하세요:', targetUser.unitCode);
        if (newUnitCode === null) return;

        targetUser.name = newName.trim() || targetUser.name;
        targetUser.unitCode = newUnitCode.trim() || targetUser.unitCode;

        if (targetUser.role === 'user') {
          const newEnlist = prompt('수정할 입대일을 입력하세요 (YYYY-MM-DD):', targetUser.enlistDate || '');
          if (newEnlist !== null) targetUser.enlistDate = newEnlist;

          const newDischarge = prompt('수정할 전역예정일을 입력하세요 (YYYY-MM-DD):', targetUser.dischargeDate || '');
          if (newDischarge !== null) targetUser.dischargeDate = newDischarge;
        }

        localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
        alert(`${targetUser.milNumber} 번 인원의 정보가 수정되었습니다.`);
        renderAdminUserList();
      }

      function deleteUserDB(milNumber) {
        if (confirm(`군번 [${milNumber}] 인원을 정말 삭제하시겠습니까?`)) {
          users = users.filter(u => u.milNumber !== milNumber);
          localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
          alert('인원이 DB에서 삭제되었습니다.');
          renderAdminUserList();
        }
      }

      updateUI();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
