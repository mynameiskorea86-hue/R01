<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5기갑 방공대 커뮤니티</title>
  <link rel="manifest" href="/R01/manifest.json">
  <!-- Supabase 클라이언트 라이브러리 추가 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h2 {
      font-size: 14px;
      color: #0056b3;
      font-weight: 700;
      letter-spacing: 1px;
    }

    header h1 {
      font-size: 22px;
      color: #111;
      margin-top: 4px;
    }

    main {
      display: none;
    }

    main.active {
      display: block !important;
    }

    .hidden {
      display: none !important;
    }

    .card {
      background-color: #f8f9fa;
      border-radius: 12px;
      padding: 18px;
      border: 1px solid #e9ecef;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 14px;
      color: #222;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #495057;
      margin-top: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #0056b3;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .primary-btn {
      background-color: #0056b3;
      color: white;
      padding: 12px;
      width: 100%;
    }

    .primary-btn:hover {
      background-color: #004085;
    }

    .ghost-btn {
      background-color: transparent;
      color: #495057;
      border: 1px solid #ced4da;
      padding: 10px;
      width: 100%;
    }

    .ghost-btn:hover {
      background-color: #e9ecef;
    }

    .user-profile-card {
      background-color: #eef5ff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }

    .user-profile-card h3 {
      font-size: 16px;
      color: #004085;
      margin-bottom: 4px;
    }

    .user-profile-card p {
      font-size: 13px;
      color: #6c757d;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .menu-card {
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 18px 10px;
      font-size: 14px;
      color: #333;
      text-align: center;
      border-radius: 10px;
      position: relative;
    }

    .menu-card:hover {
      background-color: #e2e6ea;
    }

    .detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .detail-header button {
      width: auto;
      padding: 6px 12px;
      font-size: 12px;
    }

    .detail-header h2 {
      font-size: 18px;
    }

    .status-badge {
      font-weight: bold;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .status-reviewing {
      color: #111111;
      background-color: #e2e3e5;
    }

    .status-completed {
      color: #28a745;
      background-color: #d4edda;
    }

    .status-reexamine {
      color: #dc3545;
      background-color: #f8d7da;
    }

    .status-cancelled {
      color: #6c757d;
      background-color: #e2e3e5;
      text-decoration: line-through;
    }

    .cancelled-text {
      text-decoration: line-through;
      color: #adb5bd !important;
    }

    .new-badge {
      background-color: #ff0000 !important;
      color: #ffffff !important;
      font-size: 11px !important;
      font-weight: 800 !important;
      padding: 2px 7px !important;
      border-radius: 12px !important;
      margin-left: 6px !important;
      display: inline-block !important;
      vertical-align: middle !important;
      box-shadow: 0 0 5px rgba(255, 0, 0, 0.8) !important;
      line-height: 1.2 !important;
    }

    .analysis-badge {
      font-weight: bold;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-block;
      margin-right: 4px;
    }
    .analysis-anxiety { background-color: #ff2a2a; color: #ffffff; }
    .analysis-check { background-color: #ff9800; color: #ffffff; }
    .analysis-etc { background-color: #17a2b8; color: #ffffff; }

    .sug-category-badge {
      font-weight: bold;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-block;
      margin-right: 4px;
    }
    .sug-equipment { background-color: #17a2b8; color: #ffffff; }
    .sug-facility { background-color: #fd7e14; color: #ffffff; }
    .sug-etc { background-color: #6c757d; color: #ffffff; }

    .clamp-2-lines {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
    }

    footer {
      margin-top: auto;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h2>5기갑</h2>
      <h1>방공대 커뮤니티</h1>
    </header>

    <main id="authScreen" class="active">
      <div class="card">
        <h3>로그인</h3>
        <form id="loginForm">
          <label>군번(아이디)</label>
          <input type="text" id="loginMilNumber" placeholder="예: 21-123456" required>
          
          <label>비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력" required>
          
          <button type="submit" class="primary-btn">로그인</button>
        </form>
        <button id="showRegisterBtn" class="ghost-btn" style="margin-top: 10px;">회원가입</button>
      </div>

      <div id="registerCard" class="card hidden" style="margin-top: 15px;">
        <h3>회원가입</h3>
        <form id="registerForm">
          <label>군번</label>
          <input type="text" id="milNumber" placeholder="예: 21-123456" required>

          <label>이름</label>
          <input type="text" id="registerName" placeholder="예: 홍길동" required>

          <label>부대 코드</label>
          <input type="text" id="unitCode" placeholder="예: 1-1대대" required>

          <label>직책</label>
          <select id="roleSelect" required>
            <option value="user" selected>용사</option>
            <option value="officer">간부</option>
            <option value="commander">지휘자</option>
            <option value="admin">관리자</option>
          </select>

          <div id="registerSoldierDatesGroup" style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px;">
            <label>입대일</label>
            <input type="date" id="registerEnlistDate">

            <label>전역예정일</label>
            <input type="date" id="registerDischargeDate">
          </div>

          <label style="margin-top: 8px;">비밀번호 설정</label>
          <input type="password" id="registerPassword" placeholder="비밀번호 입력" required>

          <label>비밀번호 확인</label>
          <input type="password" id="registerPasswordConfirm" placeholder="비밀번호 다시 입력" required>

          <button type="submit" class="primary-btn" style="margin-top: 15px;">가입하기</button>
        </form>
      </div>
    </main>

    <main id="homeScreen" class="hidden">
      <div class="user-profile-card">
        <h3 id="userGreeting">사용자님 환영합니다</h3>
        <p id="userInfoText">정보 로딩 중...</p>
      </div>

      <div class="menu-grid">
        <button class="menu-card" data-menu="leave">📅 출타신청 <span id="badge-leave"></span></button>
        <button class="menu-card" data-menu="letter">💬 대장과의 대화 <span id="badge-letter"></span></button>
        <button class="menu-card" data-menu="barber">✂️ 이발소 신청 <span id="badge-barber"></span></button>
        <button class="menu-card" data-menu="suggestion">📝 건의사항 <span id="badge-suggestion"></span></button>
        <button class="menu-card" data-menu="notice">📢 공지사항 <span id="badge-notice"></span></button>
        <button id="adminCard" class="menu-card hidden" data-menu="admin" style="background-color: #e2e3e5;">🗂️ 관리자 DB</button>
      </div>
    </main>

    <main id="detailScreen" class="hidden">
      <div class="detail-header">
        <button id="backToHomeBtn" class="ghost-btn">← 뒤로가기</button>
        <h2 id="detailTitle">상세 페이지</h2>
      </div>
      <div id="detailContent" class="card"></div>
    </main>

    <footer>
      <button id="logoutBtn" class="ghost-btn hidden" style="color: #dc3545; border-color: #dc3545;">로그아웃</button>
      <button id="resetDataBtn" class="ghost-btn hidden" style="margin-top:10px; font-size:11px; color:#dc3545; border-color:#f8d7da; background-color:#f8d7da;">⚠️ 데이터 초기화 (최고 관리자 전용)</button>
    </footer>
  </div>

  <script>
    // Supabase 설정 (본인의 URL과 Publishable key로 변경하세요)
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_PUBLISHABLE_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = JSON.parse(localStorage.getItem('app_session')) || null;

    function getTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    async function initDefaultAdmin() {
      // app_users 테이블에 admin 계정이 없으면 자동 생성
      const { data, error } = await supabase.from('app_users').select('*').eq('milNumber', 'admin');
      if (data && data.length === 0) {
        await supabase.from('app_users').insert([{
          milNumber: 'admin',
          password: 'admin1234',
          name: '최고관리자',
          role: 'admin',
          unitCode: '본부'
        }]);
      }
    }

    function isManager() {
      return currentUser && (currentUser.role === 'commander' || currentUser.role === 'admin');
    }

    function isAdminUser() {
      return currentUser && currentUser.role === 'admin';
    }

    function isSuperAdmin() {
      return currentUser && currentUser.milNumber === 'admin';
    }

    function getStatusBadgeHTML(status, customCompletedText = '조치완료') {
      if (status === '조치완료' || status === '검토완료' || status === '예약완료') {
        return `<span class="status-badge status-completed">${customCompletedText}</span>`;
      } else if (status === '재검토') {
        return `<span class="status-badge status-reexamine">재검토</span>`;
      } else if (status === '취소됨') {
        return `<span class="status-badge status-cancelled">취소됨</span>`;
      } else {
        return `<span class="status-badge status-reviewing">검토중</span>`;
      }
    }

    function analyzeLetterContent(text) {
      if (!text) return null;
      const normalizedText = text.replace(/\s+/g, '');
      const anxietyKeywords = ['죽고싶', '죽고', '자살', '우울', '불면', '불안', '숨막', '숨이막', '괴롭', '정신적', '답답', '살기싫', '포기', '버티기', '공황', '잠이안', '잠도안', '잠을못', '힘들'];
      const checkKeywords = ['폭행', '욕설', '부조리', '가혹행위', '구타', '괴롭힘', '탈영', '신고', '갈취', '따돌림', '왕따', '협박', '폭언', '갈구'];
      const etcKeywords = ['고충', '상담', '건의', '어려움', '아픕', '병가', '병원', '진료', '외진'];

      let detectedAnxiety = [];
      let detectedCheck = [];
      let detectedEtc = [];

      anxietyKeywords.forEach(k => { if (text.includes(k) || normalizedText.includes(k)) detectedAnxiety.push(k); });
      checkKeywords.forEach(k => { if (text.includes(k) || normalizedText.includes(k)) detectedCheck.push(k); });
      etcKeywords.forEach(k => { if (text.includes(k) || normalizedText.includes(k)) detectedEtc.push(k); });

      detectedAnxiety = [...new Set(detectedAnxiety)];
      detectedCheck = [...new Set(detectedCheck)];
      detectedEtc = [...new Set(detectedEtc)];

      let tags = [];
      if (detectedAnxiety.length > 0) tags.push({ type: 'anxiety', label: '⚠️ 심리불안', keywords: detectedAnxiety });
      if (detectedCheck.length > 0) tags.push({ type: 'check', label: '🔍 확인필요', keywords: detectedCheck });
      if (detectedEtc.length > 0 && tags.length === 0) tags.push({ type: 'etc', label: '💡 기타고충', keywords: detectedEtc });

      return tags.length > 0 ? tags : null;
    }

    function classifySuggestionContent(text) {
      if (!text) return { category: 'etc', label: '💡 기타', keywords: [] };
      const normalizedText = text.replace(/\s+/g, '');

      const equipmentKeywords = ['사주세요', '구매', '사주', '교체', '구입', '사다', '비품', '물품', '장비', '기자재', '용품', '사주십쇼', '신청'];
      const facilityKeywords = ['고쳐주세요', '고장', '난방', '에어컨', '히터', '수리', '보수', '파손', '누수', '샤워기', '변기', '세면대', '문고리', '창문', '전등', '환풍기', '냉방', '보일러', '따뜻', '춥', '더워', '더움'];

      let detectedEquipment = [];
      let detectedFacility = [];

      equipmentKeywords.forEach(k => { if (text.includes(k) || normalizedText.includes(k)) detectedEquipment.push(k); });
      facilityKeywords.forEach(k => { if (text.includes(k) || normalizedText.includes(k)) detectedFacility.push(k); });

      detectedEquipment = [...new Set(detectedEquipment)];
      detectedFacility = [...new Set(detectedFacility)];

      if (detectedEquipment.length > 0) {
        return { category: 'equipment', label: '🛒 기자재', keywords: detectedEquipment };
      } else if (detectedFacility.length > 0) {
        return { category: 'facility', label: '🛠️ 시설·난방', keywords: detectedFacility };
      } else {
        return { category: 'etc', label: '💡 기타', keywords: [] };
      }
    }

    function getReadCommentIds() {
      if (!currentUser) return [];
      const readsMap = JSON.parse(localStorage.getItem('app_comment_reads_v3')) || {};
      return readsMap[currentUser.milNumber] || [];
    }

    function getUnreadCommentCount(comments = []) {
      if (!currentUser || !comments || comments.length === 0) return 0;
      const readIds = getReadCommentIds();
      return comments.filter(c => {
        const isMyComment = c.authorMilNumber && (c.authorMilNumber === currentUser.milNumber);
        const isRead = readIds.includes(c.id);
        return !isMyComment && !isRead;
      }).length;
    }

    function markCommentsAsRead(comments = []) {
      if (!currentUser || !comments || comments.length === 0) return;
      const readsMap = JSON.parse(localStorage.getItem('app_comment_reads_v3')) || {};
      let userReads = readsMap[currentUser.milNumber] || [];
      comments.forEach(c => {
        if (!userReads.includes(c.id)) userReads.push(c.id);
      });
      readsMap[currentUser.milNumber] = userReads;
      localStorage.setItem('app_comment_reads_v3', JSON.stringify(readsMap));
    }

    async function updateMenuBadges() {
      if (!currentUser) return;

      const { data: leaves } = await supabase.from('leaves').select('*');
      const { data: letters } = await supabase.from('letters').select('*');
      const { data: barber } = await supabase.from('barber_bookings').select('*');
      const { data: suggestions } = await supabase.from('suggestions').select('*');
      const { data: notices } = await supabase.from('notices').select('*');

      const checkListNew = (items, isLetter = false) => {
        let count = 0;
        if (!items) return 0;
        items.forEach(item => {
          let comments = item.comments || [];
          if (typeof comments === 'string') { try { comments = JSON.parse(comments); } catch(e){ comments = []; } }
          if (isLetter) {
            const isMyPost = item.authorMilNumber === currentUser.milNumber;
            const isCommander = currentUser.role === 'commander';
            if (isMyPost || isCommander) count += getUnreadCommentCount(comments);
          } else {
            count += getUnreadCommentCount(comments);
          }
        });
        return count;
      };

      const updateBadge = (id, count) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = count > 0 ? `<span class="new-badge">N ${count}</span>` : '';
      };

      updateBadge('badge-leave', checkListNew(leaves));
      updateBadge('badge-letter', checkListNew(letters, true));
      updateBadge('badge-barber', checkListNew(barber));
      updateBadge('badge-suggestion', checkListNew(suggestions));
      updateBadge('badge-notice', checkListNew(notices));
    }

    function renderCommentsSection(postId, comments = [], canReply = false, tableName = '') {
      if (typeof comments === 'string') {
        try { comments = JSON.parse(comments); } catch(e) { comments = []; }
      }
      const count = comments ? comments.length : 0;
      const unreadCount = getUnreadCommentCount(comments);
      const badgeHTML = unreadCount > 0 ? `<span class="new-badge">N ${unreadCount}</span>` : '';

      let html = `<div style="margin-top:10px; border-top:1px dashed #ddd; padding-top:8px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <button class="toggle-comment-box-btn ghost-btn" data-post-id="${postId}" style="padding:6px 12px; font-size:12px; width:auto; color:#0056b3; font-weight:bold;">
            💬 댓글 ${count}개 보기/작성 ${badgeHTML}
          </button>
        </div>
        <div id="commentContainer-${postId}" class="hidden" style="margin-top:10px; background:#f8f9fa; padding:10px; border-radius:6px; border:1px solid #e0e0e0;">`;

      if (!comments || comments.length === 0) {
        html += `<p style="font-size:11px; color:#999; margin-bottom:8px;">등록된 댓글이 없습니다.</p>`;
      } else {
        comments.forEach(c => {
          const isMyComment = c.authorMilNumber === currentUser?.milNumber;
          html += `
            <div style="font-size:12px; background:#fff; padding:8px; border-radius:6px; margin-bottom:6px; border:1px solid #e9ecef;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <strong>[${c.role === 'commander' ? '지휘관' : (c.role === 'admin' ? '관리자' : (c.role === 'officer' ? '간부' : '작성자'))}] ${c.author || '익명'}</strong>
                <div>
                  <span style="font-size:10px; color:#aaa; margin-right:6px;">${c.createdAt || ''}</span>
                  ${isMyComment ? `<button class="edit-comment-btn ghost-btn" data-table="${tableName}" data-post-id="${postId}" data-comment-id="${c.id}" style="padding:2px 6px; font-size:10px; display:inline;">수정</button>` : ''}
                </div>
              </div>
              <div style="font-size:13px; color:#333; white-space:pre-wrap;">${c.content}</div>
            </div>
          `;
        });
      }

      if (canReply) {
        html += `
          <div id="commentInputBox-${postId}" style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">
            <textarea id="commentInput-${postId}" placeholder="답변 또는 댓글을 입력하세요..." style="width:100%; height:60px; padding:8px; font-size:13px; resize:vertical;"></textarea>
            <div style="display:flex; gap:6px;">
              <button class="add-comment-btn primary-btn" data-table="${tableName}" data-post-id="${postId}" style="padding:6px; font-size:12px; flex:1;">등록하기</button>
            </div>
          </div>
        `;
      }

      html += `</div></div>`;
      return html;
    }

    async function initApp() {
      await initDefaultAdmin();

      const authScreen = document.getElementById('authScreen');
      const homeScreen = document.getElementById('homeScreen');
      const detailScreen = document.getElementById('detailScreen');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const registerCard = document.getElementById('registerCard');
      const showRegisterBtn = document.getElementById('showRegisterBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const resetDataBtn = document.getElementById('resetDataBtn');
      const backToHomeBtn = document.getElementById('backToHomeBtn');
      const adminCard = document.getElementById('adminCard');

      const roleSelect = document.getElementById('roleSelect');
      const registerSoldierDatesGroup = document.getElementById('registerSoldierDatesGroup');

      if (roleSelect && registerSoldierDatesGroup) {
        roleSelect.addEventListener('change', () => {
          registerSoldierDatesGroup.style.display = roleSelect.value === 'user' ? 'flex' : 'none';
        });
      }

      function showScreen(targetScreen) {
        [authScreen, homeScreen, detailScreen].forEach(s => {
          if (s) {
            s.style.display = 'none';
            s.classList.remove('active');
            s.classList.add('hidden');
          }
        });

        if (targetScreen) {
          targetScreen.style.display = 'block';
          targetScreen.classList.remove('hidden');
          targetScreen.classList.add('active');
        }
      }

      async function updateUI() {
        if (currentUser) {
          let roleName = '용사';
          if (currentUser.role === 'officer') roleName = '간부';
          if (currentUser.role === 'commander') roleName = '지휘자';
          if (currentUser.role === 'admin') roleName = '관리자';

          document.getElementById('userGreeting').textContent = `${currentUser.name} (${roleName})님 환영합니다`;
          document.getElementById('userInfoText').textContent = `${currentUser.milNumber} · ${currentUser.unitCode}`;
          
          if (logoutBtn) logoutBtn.classList.remove('hidden');

          const isAdmin = isAdminUser();
          if (adminCard) {
            adminCard.classList.toggle('hidden', !isAdmin);
          }
          if (resetDataBtn) {
            resetDataBtn.classList.toggle('hidden', !isSuperAdmin());
          }

          await updateMenuBadges();
          showScreen(homeScreen);
        } else {
          if (logoutBtn) logoutBtn.classList.add('hidden');
          if (resetDataBtn) resetDataBtn.classList.add('hidden');
          showScreen(authScreen);
        }
      }

      showRegisterBtn?.addEventListener('click', () => registerCard.classList.toggle('hidden'));

      registerForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const milNumber = document.getElementById('milNumber').value.trim();
        const name = document.getElementById('registerName').value.trim();
        const unitCode = document.getElementById('unitCode').value.trim();
        const role = document.getElementById('roleSelect').value;
        const password = document.getElementById('registerPassword').value;
        const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

        if (password !== passwordConfirm) {
          alert('비밀번호가 일치하지 않습니다.');
          return;
        }

        const { data: users } = await supabase.from('app_users').select('*');
        const existingUser = users.find(u => u.milNumber === milNumber);

        if (existingUser) {
          if (existingUser.password) {
            alert('이미 가입된 계정입니다.');
            return;
          } else {
            const updateData = { name, unitCode, role, password };
            if (role === 'user') {
              updateData.enlist_date = document.getElementById('registerEnlistDate').value;
              updateData.discharge_date = document.getElementById('registerDischargeDate').value;
            }
            await supabase.from('app_users').update(updateData).eq('milNumber', milNumber);
          }
        } else {
          const newUser = { milNumber, name, unitCode, role, password };
          if (role === 'user') {
            newUser.enlist_date = document.getElementById('registerEnlistDate').value;
            newUser.discharge_date = document.getElementById('registerDischargeDate').value;
          }
          await supabase.from('app_users').insert([newUser]);
        }

        alert('회원가입 완료! 로그인해 주세요.');
        registerCard.classList.add('hidden');
        registerForm.reset();
      });

      loginForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const milNumber = document.getElementById('loginMilNumber').value.trim();
        const password = document.getElementById('loginPassword').value;

        const { data: users } = await supabase.from('app_users').select('*');
        const user = users.find(u => u.milNumber === milNumber && u.password === password && u.password !== '');
        
        if (user) {
          currentUser = user;
          localStorage.setItem('app_session', JSON.stringify(currentUser));
          updateUI();
        } else {
          alert('군번 또는 비밀번호가 올바르지 않습니다.');
        }
      });

      logoutBtn?.addEventListener('click', () => {
        currentUser = null;
        localStorage.removeItem('app_session');
        updateUI();
      });

      resetDataBtn?.addEventListener('click', () => {
        if (!isSuperAdmin()) {
          alert('최고 관리자만 데이터를 초기화할 수 있습니다.');
          return;
        }

        if (confirm('로컬 세션이 초기화됩니다. 계속하시겠습니까?')) {
          localStorage.clear();
          alert('초기화되었습니다. 페이지를 새로고침합니다.');
          location.reload();
        }
      });

      backToHomeBtn?.addEventListener('click', async () => {
        await updateMenuBadges();
        showScreen(homeScreen);
      });

      document.querySelectorAll('.menu-card').forEach(btn => {
        btn.addEventListener('click', () => {
          const menu = btn.dataset.menu;
          if (menu === 'leave') openLeavePage();
          else if (menu === 'letter') openLetterBoard();
          else if (menu === 'barber') openBarberPage();
          else if (menu === 'suggestion') openSuggestionPage();
          else if (menu === 'notice') openNoticePage();
          else if (menu === 'admin') openAdminPage();
        });
      });

      function bindCommonEvents(tableName, renderFunc) {
        document.querySelectorAll('.toggle-comment-box-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const postId = parseInt(e.currentTarget.dataset.postId);
            const container = document.getElementById(`commentContainer-${postId}`);
            if (container) {
              const isHidden = container.classList.contains('hidden');
              container.classList.toggle('hidden');

              if (isHidden) {
                const { data: items } = await supabase.from(tableName).select('*');
                const post = items.find(i => i.id === postId);
                if (post && post.comments) {
                  let comments = post.comments;
                  if (typeof comments === 'string') { try { comments = JSON.parse(comments); } catch(e){ comments = []; } }
                  markCommentsAsRead(comments);
                  const badge = e.currentTarget.querySelector('.new-badge');
                  if (badge) badge.remove();
                }
              }
            }
          });
        });

        document.querySelectorAll('.add-comment-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const tName = e.target.dataset.table;
            const postId = parseInt(e.target.dataset.postId);
            const textarea = document.getElementById(`commentInput-${postId}`);
            const content = textarea.value.trim();
            if (!content) return alert('내용을 입력해주세요.');

            const { data: items } = await supabase.from(tName).select('*');
            const post = items.find(i => i.id === postId);
            if (post) {
              let comments = post.comments || [];
              if (typeof comments === 'string') { try { comments = JSON.parse(comments); } catch(e){ comments = []; } }
              const editingId = textarea.dataset.editingCommentId;

              if (editingId) {
                const comment = comments.find(c => c.id === parseInt(editingId));
                if (comment) {
                  comment.content = content;
                  comment.createdAt = getTodayString() + ' (수정됨)';
                }
              } else {
                const newComment = {
                  id: Date.now(),
                  authorMilNumber: currentUser.milNumber,
                  author: currentUser.name,
                  role: currentUser.role,
                  content,
                  createdAt: getTodayString()
                };
                comments.push(newComment);
              }

              await supabase.from(tName).update({ comments: comments }).eq('id', postId);
              markCommentsAsRead(comments); 
              renderFunc();
              
              const container = document.getElementById(`commentContainer-${postId}`);
              if (container) container.classList.remove('hidden');
            }
          });
        });

        document.querySelectorAll('.edit-comment-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const tName = e.target.dataset.table;
            const postId = parseInt(e.target.dataset.postId);
            const commentId = parseInt(e.target.dataset.commentId);
            const { data: items } = await supabase.from(tName).select('*');
            const post = items.find(i => i.id === postId);
            if (!post) return;
            let comments = post.comments || [];
            if (typeof comments === 'string') { try { comments = JSON.parse(comments); } catch(e){ comments = []; } }
            const comment = comments.find(c => c.id === commentId);
            if (!comment) return;

            const textarea = document.getElementById(`commentInput-${postId}`);
            const button = document.querySelector(`#commentInputBox-${postId} .add-comment-btn`);

            if (textarea && button) {
              textarea.value = comment.content;
              textarea.dataset.editingCommentId = commentId;
              button.textContent = '수정 완료';
              textarea.focus();
            }
          });
        });

        document.querySelectorAll('.change-status-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const postId = parseInt(e.target.dataset.postId);
            const status = e.target.dataset.status;
            await supabase.from(tableName).update({ status: status }).eq('id', postId);
            renderFunc();
          });
        });
      }

      async function openLeavePage() {
        document.getElementById('detailTitle').textContent = '방공대 출타신청';
        await renderLeavePage();
        showScreen(detailScreen);
      }

      async function renderLeavePage() {
        const { data: leaves } = await supabase.from('leaves').select('*').order('id', { ascending: false });
        const detailContent = document.getElementById('detailContent');
        const today = getTodayString();

        let html = `
          <form id="leaveForm" style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;">
            <label>출타 유형
              <select id="leaveType" style="width:100%; padding:8px;" required>
                <option value="휴가">휴가</option>
                <option value="외박">외박</option>
                <option value="외출">외출</option>
              </select>
            </label>
            <label>시작일 <input type="date" id="leaveStart" min="${today}" style="width:100%; padding:8px;" required /></label>
            <label>종료일 <input type="date" id="leaveEnd" min="${today}" style="width:100%; padding:8px;" required /></label>
            <label>사유 <input type="text" id="leaveReason" placeholder="출타 사유 입력" style="width:100%; padding:8px;" required /></label>

          <hr style="margin:20px 0; border:none; border-top:1px solid #eee;" />

          <div id="leaveList">
        `;

        if (!leaves || leaves.length === 0) {
          html += `<p style="font-size:12px; color:#888;">신청 내역이 없습니다.</p>`;
        } else {
          leaves.forEach(l => {
            const status = l.status || '검토중';
            const isMyPost = currentUser.milNumber === l.mil_number;
            const isCancelled = status === '취소됨';

            let textStyle = isCancelled ? 'cancelled-text' : '';
            let editSuffix = (l.updated_at && !isCancelled) ? ` <span style="font-size:11px; color:#0056b3; font-weight:normal;">(수정됨)</span>` : '';
            let cancelledSuffix = isCancelled ? ` <span style="font-size:11px; color:#dc3545; font-weight:bold;">(수정됨 - 취소됨)</span>` : '';

            html += `
              <div style="border:1px solid ${isCancelled ? '#f1f3f5' : '#ddd'}; padding:12px; border-radius:8px; margin-bottom:12px; background:${isCancelled ? '#f8f9fa' : '#fff'};">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <strong class="${textStyle}">[${l.type}] ${l.name} (${l.mil_number || '용사'}) ${editSuffix} ${cancelledSuffix}</strong>
                  ${getStatusBadgeHTML(status, '검토완료')}
                </div>
                <p style="font-size:12px; color:${isCancelled ? '#adb5bd' : '#555'}; margin:6px 0;" class="${textStyle}">기간: ${l.start_date} ~ ${l.end_date}<br/>사유: ${l.reason}</p>
                
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                  <div>
                    ${isManager() ? `
                      <div style="display:flex; gap:4px; align-items:center;">
                        <span style="font-size:11px; font-weight:bold; color:#555;">상태:</span>
                        <button class="change-status-btn" data-post-id="${l.id}" data-status="조치완료" style="padding:2px 5px; font-size:10px; background-color:#28a745; color:white;">검토완료</button>
                        <button class="change-status-btn" data-post-id="${l.id}" data-status="재검토" style="padding:2px 5px; font-size:10px; background-color:#dc3545; color:white;">재검토</button>
                        <button class="change-status-btn" data-post-id="${l.id}" data-status="검토중" style="padding:2px 5px; font-size:10px; background-color:#6c757d; color:white;">검토중</button>
                      </div>
                    ` : ''}
                  </div>
                  <div>
                    ${isMyPost && !isCancelled ? `
                      <button class="edit-leave-btn ghost-btn" data-post-id="${l.id}" style="padding:3px 8px; font-size:11px; width:auto; display:inline-block; margin-right:4px;">수정</button>
                      <button class="cancel-leave-btn ghost-btn" data-post-id="${l.id}" style="padding:3px 8px; font-size:11px; width:auto; color:#dc3545; border-color:#dc3545; display:inline-block;">취소하기</button>
                    ` : ''}
                  </div>
                </div>

                <div id="editLeaveBox-${l.id}" class="hidden" style="margin-top:10px; background:#fff; padding:10px; border-radius:6px; border:1px solid #ced4da;">
                  <h4 style="font-size:12px; margin-bottom:6px; color:#0056b3;">출타 신청 수정</h4>
                  <label style="font-size:11px;">유형 <select id="editLeaveType-${l.id}" style="padding:4px;"><option value="휴가" ${l.type==='휴가'?'selected':''}>휴가</option><option value="외박" ${l.type==='외박'?'selected':''}>외박</option><option value="외출" ${l.type==='외출'?'selected':''}>외출</option></select></label>
                  <label style="font-size:11px;">시작일 <input type="date" id="editLeaveStart-${l.id}" value="${l.start_date}" style="padding:4px;" /></label>
                  <label style="font-size:11px;">종료일 <input type="date" id="editLeaveEnd-${l.id}" value="${l.end_date}" style="padding:4px;" /></label>
                  <label style="font-size:11px;">사유 <input type="text" id="editLeaveReason-${l.id}" value="${l.reason}" style="padding:4px;" /></label>
                  <div style="display:flex; gap:4px; margin-top:8px;">
                    <button class="submit-edit-leave-btn primary-btn" data-post-id="${l.id}" style="padding:6px; font-size:11px;">수정 완료</button>
                    <button class="cancel-edit-leave-btn ghost-btn" data-post-id="${l.id}" style="padding:6px; font-size:11px;">닫기</button>
                  </div>
                </div>

                ${renderCommentsSection(l.id, l.comments, isManager() || isMyPost, 'leaves')}
              </div>
            `;
          });
        }

        html += `</div>`;
        detailContent.innerHTML = html;

        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const newLeave = {
            mil_number: currentUser.milNumber,
            name: currentUser.name,
            type: document.getElementById('leaveType').value,
            start_date: document.getElementById('leaveStart').value,
            end_date: document.getElementById('leaveEnd').value,
            reason: document.getElementById('leaveReason').value,
            status: '검토중',
            comments: []
          };
          await supabase.from('leaves').insert([newLeave]);
          alert('출타 신청이 완료되었습니다.');
          await renderLeavePage();
        });

        document.querySelectorAll('.cancel-leave-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const postId = parseInt(e.target.dataset.postId);
            if (confirm('정말 이 출타 신청을 취소하시겠습니까?')) {
              await supabase.from('leaves').update({ status: '취소됨', updated_at: getTodayString() }).eq('id', postId);
              await renderLeavePage();
            }
          });
        });

        document.querySelectorAll('.edit-leave-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const postId = parseInt(e.target.dataset.postId);
            const box = document.getElementById(`editLeaveBox-${postId}`);
            if (box) box.classList.toggle('hidden');
          });
        });

        document.querySelectorAll('.cancel-edit-leave-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const postId = parseInt(e.target.dataset.postId);
            const box = document.getElementById(`editLeaveBox-${postId}`);
            if (box) box.classList.add('hidden');
          });
        });

        document.querySelectorAll('.submit-edit-leave-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const postId = parseInt(e.target.dataset.postId);
            const updatedValues = {
              type: document.getElementById(`editLeaveType-${postId}`).value,
              start_date: document.getElementById(`editLeaveStart-${postId}`).value,
              end_date: document.getElementById(`editLeaveEnd-${postId}`).value,
              reason: document.getElementById(`editLeaveReason-${postId}`).value,
              updated_at: getTodayString()
            };
            await supabase.from('leaves').update(updatedValues).eq('id', postId);
            alert('출타 신청 내용이 수정되었습니다.');
            await renderLeavePage();
          });
        });

        bindCommonEvents('leaves', renderLeavePage);
      }

      async function openLetterBoard() {
        document.getElementById('detailTitle').textContent = '대장과의 대화 (마음의 편지)';
        await renderLetterList();
        showScreen(detailScreen);
      }

      async function renderLetterList() {
        const { data: letters } = await supabase.from('letters').select('*').order('id', { ascending: false });
        const detailContent = document.getElementById('detailContent');
        const isCommander = currentUser.role === 'commander';

        let html = '';
        if (!isCommander) {
          html += `
            <div style="margin-bottom: 20px;">
              <button id="writeLetterBtn" class="primary-btn" style="width:100%; margin-bottom:15px;">✍️ 마음의 편지 작성하기</button>
              <div id="letterWriteForm" class="hidden" style="background:#f5f5f5; padding:15px; border-radius:8px; margin-bottom:15px;">
                <input type="text" id="letterTitle" placeholder="제목을 입력하세요" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;" required />
                <textarea id="letterText" placeholder="내용을 입력하세요..." style="width:100%; height:100px; padding:8px; margin-bottom:10px; box-sizing:border-box;" required></textarea>
                <button id="submitLetterBtn" class="primary-btn" style="width:100%;">등록</button>
              </div>
            </div>
          `;
        }

        html += `<div class="letter-list">`;
        if (!letters || letters.length === 0) {
          html += `<p style="text-align:center; color:#888;">등록된 편지가 없습니다.</p>`;
        } else {
          letters.forEach((post) => {
            const isMyPost = currentUser.milNumber === post.author_mil_number;
            const canAccess = isMyPost || isCommander; 
            const status = post.status || '검토중';

            let authorDisplay = '익명 (***)';
            if (isCommander) {
              const name = post.author_name || '용사';
              const mil = post.author_mil_number ? ` (${post.author_mil_number})` : '';
              authorDisplay = `🔍 ${name}${mil}`;
            } else if (isMyPost) {
              authorDisplay = '본인';
            }

            let analysisHTML = '';
            if (isCommander) {
              const fullText = (post.title || '') + ' ' + (post.content || '');
              const analysisResults = analyzeLetterContent(fullText);

              if (analysisResults) {
                analysisHTML = '<div style="margin-top:6px;">';
                analysisResults.forEach(res => {
                  let badgeClass = 'analysis-etc';
                  if (res.type === 'anxiety') badgeClass = 'analysis-anxiety';
                  if (res.type === 'check') badgeClass = 'analysis-check';
                  analysisHTML += `<span class="analysis-badge ${badgeClass}">${res.label}</span>`;
                });
                const allKeywords = analysisResults.flatMap(r => r.keywords).join(', ');
                analysisHTML += `<span style="font-size:10px; color:#d9534f; margin-left:4px;">(감지: ${allKeywords})</span>`;
                analysisHTML += '</div>';
              }
            }

            html += `
              <div class="letter-card" style="border:1px solid #eee; padding:12px; border-radius:8px; margin-bottom:12px; background:#fff;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <h4 style="margin:0; font-size:16px;">${canAccess ? '🔓 ' : '🔒 '}${post.title}</h4>
                  <div>${getStatusBadgeHTML(status, '조치완료')}</div>
                </div>
                ${analysisHTML}
                <p style="font-size:12px; color:#666; margin:6px 0;">작성자: ${authorDisplay} | 작성일: ${post.created_at}</p>
                
                ${canAccess ? `
                  <div style="margin-top:10px; padding:10px; background:#f9f9f9; border-radius:6px; font-size:14px; cursor:pointer;" class="letter-content-box" data-post-id="${post.id}">
                    <div id="letterContent-${post.id}" class="clamp-2-lines">${post.content.replace(/\n/g, '<br>')}</div>
                    <div id="letterMoreBtn-${post.id}" style="font-size:11px; color:#0056b3; margin-top:6px; font-weight:bold;">더보기 ▼</div>
                  </div>
                  
                  ${isCommander ? `
                    <div style="margin-top:8px; display:flex; gap:6px; align-items:center;">
                      <span style="font-size:12px; font-weight:bold; color:#555;">상태 변경:</span>
                      <button class="change-status-btn" data-post-id="${post.id}" data-status="조치완료" style="padding:4px 8px; font-size:11px; background-color:#28a745; color:white;">조치완료</button>
                      <button class="change-status-btn" data-post-id="${post.id}" data-status="재검토" style="padding:4px 8px; font-size:11px; background-color:#dc3545; color:white;">재검토</button>
                    </div>
                  ` : ''}
                  ${renderCommentsSection(post.id, post.comments, isCommander || isMyPost, 'letters')}
                ` : `
                  <p style="font-size:12px; color:#d9534f; margin-top:8px;">🔒 비밀글입니다. 작성자와 지휘관만 열람할 수 있습니다.</p>
                `}
              </div>
            `;
          });
        }

        html += `</div>`;
        detailContent.innerHTML = html;

        if (!isCommander) {
          document.getElementById('writeLetterBtn')?.addEventListener('click', () => {
            document.getElementById('letterWriteForm').classList.toggle('hidden');
          });

          document.getElementById('submitLetterBtn')?.addEventListener('click', async () => {
            const title = document.getElementById('letterTitle').value.trim();
            const content = document.getElementById('letterText').value.trim();
            if (!title || !content) return alert('제목과 내용을 입력해주세요.');

            await supabase.from('letters').insert([{
              title,
              content,
              author_mil_number: currentUser.milNumber,
              author_name: currentUser.name,
              created_at: getTodayString(),
              status: '검토중',
              comments: []
            }]);
            await renderLetterList();
          });
        }

        document.querySelectorAll('.letter-content-box').forEach(box => {
          box.addEventListener('click', () => {
            const postId = box.dataset.postId;
            const contentEl = document.getElementById(`letterContent-${postId}`);
            const moreBtn = document.getElementById(`letterMoreBtn-${postId}`);
            if (contentEl) {
              const isClamped = contentEl.classList.contains('clamp-2-lines');
              if (isClamped) {
                contentEl.classList.remove('clamp-2-lines');
                if (moreBtn) moreBtn.textContent = '접기 ▲';
              } else {
                contentEl.classList.add('clamp-2-lines');
                if (moreBtn) moreBtn.textContent = '더보기 ▼';
              }
            }
          });
        });

        bindCommonEvents('letters', renderLetterList);
      }

      async function openBarberPage() {
        document.getElementById('detailTitle').textContent = '이발소 예약 신청';
        await renderBarberPage();
        showScreen(detailScreen);
      }

      async function renderBarberPage() {
        const { data: barberBookings } = await supabase.from('barber_bookings').select('*').order('id', { ascending: false });
        const detailContent = document.getElementById('detailContent');
        const today = getTodayString();

        let html = `
          <form id="barberForm" style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;">
            <label>예약 희망일 <input type="date" id="barberDate" min="${today}" style="width:100%; padding:8px;" required /></label>
            <button type="submit" class="primary-btn">예약하기</button>
          </form>
          <hr style="margin:20px 0; border:none; border-top:1px solid #eee;" />
          <h3>전체 이발소 예약 목록</h3>
          <div id="barberList">
        `;

        if (!barberBookings || barberBookings.length === 0) {
          html += `<p style="font-size:12px; color:#888;">예약 내역이 없습니다.</p>`;
        } else {
          barberBookings.forEach(b => {
            const status = b.status || '검토중';
            const isMyPost = currentUser.milNumber === b.mil_number;
            const isCancelled = status === '취소됨';

            let textStyle = isCancelled ? 'cancelled-text' : '';
            let editSuffix = (b.updated_at && !isCancelled) ? ` <span style="font-size:11px; color:#0056b3; font-weight:normal;">(수정됨)</span>` : '';
            let cancelledSuffix = isCancelled ? ` <span style="font-size:11px; color:#dc3545; font-weight:bold;">(수정됨 - 취소됨)</span>` : '';

            html += `
              <div style="border:1px solid ${isCancelled ? '#f1f3f5' : '#ddd'}; padding:12px; border-radius:8px; margin-bottom:12px; background:${isCancelled ? '#f8f9fa' : '#fff'};">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <strong class="${textStyle}">📅 ${b.date} - ${b.name} (${b.mil_number || '용사'}) ${editSuffix} ${cancelledSuffix}</strong>
                  ${getStatusBadgeHTML(status, '예약완료')}
                </div>
                
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                  <div>
                    ${isManager() ? `
                      <div style="display:flex; gap:4px; align-items:center;">
                        <span style="font-size:11px; font-weight:bold; color:#555;">상태:</span>
                        <button class="change-status-btn" data-post-id="${b.id}" data-status="조치완료" style="padding:2px 5px; font-size:10px; background-color:#28a745; color:white;">예약완료</button>
                        <button class="change-status-btn" data-post-id="${b.id}" data-status="재검토" style="padding:2px 5px; font-size:10px; background-color:#dc3545; color:white;">재검토</button>
                        <button class="change-status-btn" data-post-id="${b.id}" data-status="검토중" style="padding:2px 5px; font-size:10px; background-color:#6c757d; color:white;">검토중</button>
                      </div>
                    ` : ''}
                  </div>
                  <div>
                    ${isMyPost && !isCancelled ? `
                      <button class="edit-barber-btn ghost-btn" data-post-id="${b.id}" style="padding:3px 8px; font-size:11px; width:auto; display:inline-block; margin-right:4px;">수정</button>
                      <button class="cancel-barber-btn ghost-btn" data-post-id="${b.id}" style="padding:3px 8px; font-size:11px; width:auto; color:#dc3545; border-color:#dc3545; display:inline-block;">취소하기</button>
                    ` : ''}
                  </div>
                </div>

                <div id="editBarberBox-${b.id}" class="hidden" style="margin-top:10px; background:#fff; padding:10px; border-radius:6px; border:1px solid #ced4da;">
                  <h4 style="font-size:12px; margin-bottom:6px; color:#0056b3;">이발소 예약 수정</h4>
                  <label style="font-size:11px;">예약 희망일 <input type="date" id="editBarberDate-${b.id}" value="${b.date}" min="${today}" style="padding:4px;" /></label>
                  <div style="display:flex; gap:4px; margin-top:8px;">
                    <button class="submit-edit-barber-btn primary-btn" data-post-id="${b.id}" style="padding:6px; font-size:11px;">수정 완료</button>
                    <button class="cancel-edit-barber-btn ghost-btn" data-post-id="${b.id}" style="padding:6px; font-size:11px;">닫기</button>
                  </div>
                </div>

                ${renderCommentsSection(b.id, b.comments, isManager() || isMyPost, 'barber_bookings')}
              </div>
            `;
          });
        }

        html += `</div>`;
        detailContent.innerHTML = html;

        document.getElementById('barberForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          await supabase.from('barber_bookings').insert([{
            mil_number: currentUser.milNumber,
            name: currentUser.name,
            date: document.getElementById('barberDate').value,
            status: '검토중',
            comments: []
          }]);
          alert('이발소 예약이 완료되었습니다.');
          await renderBarberPage();
        });

        document.querySelectorAll('.cancel-barber-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const postId = parseInt(e.target.dataset.postId);
            if (confirm('정말 이발소 예약을 취소하시겠습니까?')) {
              await supabase.from('barber_bookings').update({ status: '취소됨', updated_at: getTodayString() }).eq('id', postId);
              await renderBarberPage();
            }
          });
        });

        document.querySelectorAll('.edit-barber-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const postId = parseInt(e.target.dataset.postId);
            const box = document.getElementById(`editBarberBox-${postId}`);
            if (box) box.classList.toggle('hidden');
          });
        });

        document.querySelectorAll('.cancel-edit-barber-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const postId = parseInt(e.target.dataset.postId);
            const box = document.getElementById(`editBarberBox-${postId}`);
            if (box) box.classList.add('hidden');
          });
        });

        document.querySelectorAll('.submit-edit-barber-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const postId = parseInt(e.target.dataset.postId);
            await supabase.from('barber_bookings').update({
              date: document.getElementById(`editBarberDate-${postId}`).value,
              updated_at: getTodayString()
            }).eq('id', postId);
            alert('이발소 예약 내용이 수정되었습니다.');
            await renderBarberPage();
          });
        });

        bindCommonEvents('barber_bookings', renderBarberPage);
      }

      async function openSuggestionPage() {
        document.getElementById('detailTitle').textContent = '건의사항';
        await renderSuggestionPage();
        showScreen(detailScreen);
      }

      async function renderSuggestionPage() {
        const { data: suggestions } = await supabase.from('suggestions').select('*').order('id', { ascending: false });
        const detailContent = document.getElementById('detailContent');

        let html = `
          <form id="suggestionForm" style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;">
            <input type="text" id="suggestionTitle" placeholder="제목" style="padding:8px;" required />
            <textarea id="suggestionContent" placeholder="건의할 내용을 입력해 주세요 (예: 보일러 고장, 축구공 사주세요 등)" style="height:80px; padding:8px;" required></textarea>
            <button type="submit" class="primary-btn">건의하기</button>
          </form>
          <hr style="margin:20px 0; border:none; border-top:1px solid #eee;" />
          <h3>등록된 건의사항 목록</h3>
          <div id="suggestionList">
        `;

        if (!suggestions || suggestions.length === 0) {
          html += `<p style="font-size:12px; color:#888;">등록된 건의사항이 없습니다.</p>`;
        } else {
          suggestions.forEach(s => {
            const status = s.status || '검토중';
            const fullText = (s.title || '') + ' ' + (s.content || '');
            const classification = classifySuggestionContent(fullText);

            let categoryBadgeClass = 'sug-etc';
            if (classification.category === 'equipment') categoryBadgeClass = 'sug-equipment';
            if (classification.category === 'facility') categoryBadgeClass = 'sug-facility';

            let categoryHTML = `<div style="margin-bottom:6px;">
              <span class="sug-category-badge ${categoryBadgeClass}">${classification.label}</span>`;
            if (isManager() && classification.keywords.length > 0) {
              categoryHTML += `<span style="font-size:10px; color:#666; margin-left:4px;">(키워드: ${classification.keywords.join(', ')})</span>`;
            }
            categoryHTML += `</div>`;

            html += `
              <div style="border:1px solid #ddd; padding:12px; border-radius:8px; margin-bottom:12px; background:#fff;">
                ${isManager() ? categoryHTML : ''}
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <h4 style="margin:0;">${s.title}</h4>
                  ${getStatusBadgeHTML(status, '조치완료')}
                </div>
                <p style="font-size:12px; color:#666; margin:4px 0 8px 0;">작성자: ${s.author_name} | ${s.date}</p>
                <p style="font-size:13px; color:#333;">${s.content}</p>
                ${isManager() ? `
                  <div style="margin-top:8px; display:flex; gap:6px; align-items:center;">
                    <span style="font-size:11px; font-weight:bold; color:#555;">상태 변경:</span>
                    <button class="change-status-btn" data-post-id="${s.id}" data-status="조치완료" style="padding:3px 6px; font-size:10px; background-color:#28a745; color:white;">조치완료</button>
                    <button class="change-status-btn" data-post-id="${s.id}" data-status="재검토" style="padding:3px 6px; font-size:10px; background-color:#dc3545; color:white;">재검토</button>
                    <button class="change-status-btn" data-post-id="${s.id}" data-status="검토중" style="padding:3px 6px; font-size:10px; background-color:#6c757d; color:white;">검토중</button>
                  </div>
                ` : ''}
                ${renderCommentsSection(s.id, s.comments, isManager() || currentUser.name === s.author_name, 'suggestions')}
              </div>
            `;
          });
        }

        html += `</div>`;
        detailContent.innerHTML = html;

        document.getElementById('suggestionForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          await supabase.from('suggestions').insert([{
            title: document.getElementById('suggestionTitle').value.trim(),
            content: document.getElementById('suggestionContent').value.trim(),
            author_name: currentUser.name,
            date: getTodayString(),
            status: '검토중',
            comments: []
          }]);
          alert('건의사항이 등록되었습니다.');
          await renderSuggestionPage();
        });

        bindCommonEvents('suggestions', renderSuggestionPage);
      }

      async function openNoticePage() {
        document.getElementById('detailTitle').textContent = '공지사항';
        await renderNoticePage();
        showScreen(detailScreen);
      }

      async function renderNoticePage() {
        const { data: notices } = await supabase.from('notices').select('*').order('id', { ascending: false });
        const detailContent = document.getElementById('detailContent');

        let html = '';
        if (isManager()) {
          html += `
            <div style="margin-bottom: 20px;">
              <button id="writeNoticeBtn" class="primary-btn" style="width:100%; margin-bottom:15px;">📢 신규 공지사항 등록</button>
              <div id="noticeWriteForm" class="hidden" style="background:#f5f5f5; padding:15px; border-radius:8px; margin-bottom:15px;">
                <input type="text" id="noticeTitle" placeholder="공지 제목 입력" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;" required />
                <textarea id="noticeContent" placeholder="공지 내용 입력..." style="width:100%; height:100px; padding:8px; margin-bottom:10px; box-sizing:border-box;" required></textarea>
                <button id="submitNoticeBtn" class="primary-btn" style="width:100%;">등록</button>
              </div>
            </div>
          `;
        }

        if (!notices || notices.length === 0) {
          html += `<p style="text-align:center; color:#888;">등록된 공지사항이 없습니다.</p>`;
        } else {
          const canReplyNotice = currentUser && currentUser.role !== 'user'; 
          notices.forEach(n => {
            html += `
              <div style="border:1px solid #ddd; padding:12px; border-radius:8px; margin-bottom:12px; background:#fff;">
                <h4 style="margin:0 0 6px 0; font-size:15px; color:#0056b3;">📢 ${n.title}</h4>
                <p style="font-size:11px; color:#888; margin:0 0 8px 0;">등록일: ${n.date}</p>
                <div style="font-size:13px; color:#333; margin-bottom:10px;">${n.content}</div>
                ${renderCommentsSection(n.id, n.comments, canReplyNotice, 'notices')}
              </div>
            `;
          });
        }

        detailContent.innerHTML = html;

        document.getElementById('writeNoticeBtn')?.addEventListener('click', () => {
          document.getElementById('noticeWriteForm').classList.toggle('hidden');
        });

        document.getElementById('submitNoticeBtn')?.addEventListener('click', async () => {
          const title = document.getElementById('noticeTitle').value.trim();
          const content = document.getElementById('noticeContent').value.trim();
          if (!title || !content) return alert('제목과 내용을 입력해 주세요.');

          await supabase.from('notices').insert([{
            title,
            content,
            date: getTodayString(),
            comments: []
          }]);
          await renderNoticePage();
        });

        bindCommonEvents('notices', renderNoticePage);
      }

      async function openAdminPage() {
        if (!isAdminUser()) {
          alert('관리자만 접근 가능합니다.');
          showScreen(homeScreen);
          return;
        }

        document.getElementById('detailTitle').textContent = '관리자 DB 제어';
        const detailContent = document.getElementById('detailContent');

        const { data: users } = await supabase.from('app_users').select('*');

        detailContent.innerHTML = `
          <div style="background:#f9f9f9; padding:12px; border-radius:8px; margin-bottom:15px; border:1px solid #e0e0e0;">
            <h3 style="margin-top:0;">➕ 신규 인원 DB 입력</h3>
            <form id="adminAddUserForm" style="display:flex; flex-direction:column; gap:8px;">
              <label style="font-size:12px;">직책 선택
                <select id="dbRole" style="width:100%; padding:6px;" required>
                  <option value="user">용사</option>
                  <option value="officer">간부</option>
                  <option value="commander">지휘자</option>
                  <option value="admin">관리자</option>
                </select>
              </label>
              <label style="font-size:12px;">군번(아이디)
                <input type="text" id="dbMilNumber" placeholder="예: 21-123456" style="width:100%; padding:6px; box-sizing:border-box;" required />
              </label>
              <label style="font-size:12px;">이름
                <input type="text" id="dbName" placeholder="예: 홍길동" style="width:100%; padding:6px; box-sizing:border-box;" required />
              </label>
              <label style="font-size:12px;">부대 코드
                <input type="text" id="dbUnitCode" placeholder="예: 5기갑 방공대" style="width:100%; padding:6px; box-sizing:border-box;" required />
              </label>
              
              <div id="soldierDatesGroup" style="display:flex; flex-direction:column; gap:8px;">
                <label style="font-size:12px;">입대일
                  <input type="date" id="dbEnlistDate" style="width:100%; padding:6px; box-sizing:border-box;" />
                </label>
                <label style="font-size:12px;">전역예정일
                  <input type="date" id="dbDischargeDate" style="width:100%; padding:6px; box-sizing:border-box;" />
                </label>
              </div>

              <button type="submit" class="primary-btn" style="margin-top:5px;">DB 등록하기</button>
            </form>
          </div>

          <hr style="margin:20px 0; border:none; border-top:1px solid #eee;" />
          <h3>전체 등록 인원 목록 (<span id="userCount">${users ? users.length : 0}</span>명)</h3>
          <div id="adminUserList" style="max-height:300px; overflow-y:auto;"></div>
        `;

        const dbRoleSelect = document.getElementById('dbRole');
        const soldierDatesGroup = document.getElementById('soldierDatesGroup');

        dbRoleSelect.addEventListener('change', () => {
          soldierDatesGroup.style.display = dbRoleSelect.value === 'user' ? 'flex' : 'none';
        });

        document.getElementById('adminAddUserForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!isAdminUser()) {
            alert('관리자만 DB에 인원을 등록할 수 있습니다.');
            return;
          }

          const role = dbRoleSelect.value;
          const milNumber = document.getElementById('dbMilNumber').value.trim();
          const name = document.getElementById('dbName').value.trim();
          const unitCode = document.getElementById('dbUnitCode').value.trim();

          const { data: currentUsers } = await supabase.from('app_users').select('*');
          if (currentUsers.find(u => u.milNumber === milNumber)) {
            alert('이미 등록된 군번입니다.');
            return;
          }

          const newUser = { milNumber, name, unitCode, role, password: '' };
          if (role === 'user') {
            newUser.enlist_date = document.getElementById('dbEnlistDate').value;
            newUser.discharge_date = document.getElementById('dbDischargeDate').value;
          }

          await supabase.from('app_users').insert([newUser]);
          alert(`${name} 님이 DB에 등록되었습니다.`);

          document.getElementById('adminAddUserForm').reset();
          await renderAdminUserList();
        });

        await renderAdminUserList();
        showScreen(detailScreen);
      }

      async function renderAdminUserList() {
        const { data: users } = await supabase.from('app_users').select('*');
        const listContainer = document.getElementById('adminUserList');
        const countSpan = document.getElementById('userCount');
        if (countSpan) countSpan.textContent = users ? users.length : 0;

        if (!users) return;

        listContainer.innerHTML = users.map(u => {
          let roleLabel = '용사';
          if (u.role === 'officer') roleLabel = '간부';
          if (u.role === 'commander') roleLabel = '지휘자';
          if (u.role === 'admin') roleLabel = '관리자';

          const statusBadge = u.password ? '<span style="color:green; font-weight:bold;">[가입완료]</span>' : '<span style="color:orange; font-weight:bold;">[미가입/DB만등록]</span>';

          return `
            <div style="border-bottom:1px solid #eee; padding:10px 0; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <strong>${u.name}</strong> (${u.milNumber}) - <span style="color:#007bff; font-weight:bold;">${roleLabel}</span> ${statusBadge}<br/>
                <span style="color:#666;">부대코드: ${u.unitCode}</span>
              </div>
              <div style="display:flex; gap:4px;">
                <button class="delete-user-btn primary-btn" data-mil="${u.milNumber}" style="padding:4px 8px; font-size:11px; background-color:#dc3545;">삭제</button>
              </div>
            </div>
          `;
        }).join('');

        document.querySelectorAll('.delete-user-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            if (!isAdminUser()) {
              alert('관리자만 삭제할 수 있습니다.');
              return;
            }
            const milNumber = e.target.dataset.mil;
            if (confirm(`군번 [${milNumber}] 인원을 삭제하시겠습니까?`)) {
              await supabase.from('app_users').delete().eq('milNumber', milNumber);
              await renderAdminUserList();
            }
          });
        });
      }

      updateUI();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/R01/sw.js")
          .then(() => console.log("Service Worker 등록 완료"))
          .catch(error => console.error("Service Worker 등록 실패:", error));
      });
    }
  </script>
